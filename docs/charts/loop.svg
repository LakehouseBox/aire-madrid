<text x="322.0" y="180.0" font-size="12" fill="#4f4a44" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">obs.meteo_hourly  ·  since 2019</text>
