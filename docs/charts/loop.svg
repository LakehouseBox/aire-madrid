<text x="322.0" y="438.0" font-size="12" fill="#4f4a44" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">its runs  ·  every query and step</text>
<rect x="740.0" y="90.0" width="200.0" height="250.0" rx="12" fill="#fff" stroke="#e0471c" stroke-width="2"/>
<text x="760.0" y="120.0" font-size="16" fill="#1a1917" text-anchor="start" font-weight="700" >Hosted agent</text>
<text x="760.0" y="140.0" font-size="12" fill="#77706a" text-anchor="start" font-weight="400" >every day at 12:00</text>
<text x="760.0" y="172.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >1  reads its record</text>
<text x="760.0" y="196.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >2  reads today and</text>
<text x="760.0" y="220.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >   tomorrow's weather</text>
<text x="760.0" y="244.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >3  writes its forecast</text>
<text x="760.0" y="268.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >4  notes what only</text>
<text x="760.0" y="292.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >   it can know</text>
