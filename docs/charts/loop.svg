<text x="254.0" y="244.0" font-size="11" fill="#77706a" text-anchor="middle" font-weight="400" >scheduled</text>
<text x="254.0" y="278.0" font-size="11" fill="#77706a" text-anchor="middle" font-weight="400" >SQL</text>
<line x1="672.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e0471c" stroke-width="2"  marker-end="url(#a-e0471c)" stroke-linecap="round"/>
<text x="704.0" y="160.0" font-size="11" fill="#e0471c" text-anchor="middle" font-weight="400" >reads</text>
<line x1="736.0" y1="262.0" x2="672.0" y2="262.0" stroke="#e0471c" stroke-width="2"  marker-end="url(#a-e0471c)" stroke-linecap="round"/>
<text x="704.0" y="252.0" font-size="11" fill="#e0471c" text-anchor="middle" font-weight="400" >writes</text>
<line x1="672.0" y1="450.0" x2="736.0" y2="450.0" stroke="#4f4a44" stroke-width="2"  marker-end="url(#a-4f4a44)" stroke-linecap="round"/>
<text x="704.0" y="440.0" font-size="11" fill="#77706a" text-anchor="middle" font-weight="400" >reads</text>
<text x="480.0" y="548.0" font-size="13" fill="#77706a" text-anchor="middle" font-weight="400" >The next day the stations' readings score the forecast, and the score is one more row the agent reads.</text>
