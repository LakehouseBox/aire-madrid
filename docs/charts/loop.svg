<text x="760.0" y="454.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >a page that reads the</text>
<text x="760.0" y="474.0" font-size="13" fill="#4f4a44" text-anchor="start" font-weight="400" >catalog in the browser</text>
